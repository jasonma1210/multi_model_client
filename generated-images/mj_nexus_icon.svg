<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 主背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="50%" style="stop-color:#283593"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    
    <!-- 神经网络线条渐变 -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#7c4dff"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 文字发光 -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180" fill="url(#bgGradient)"/>
  
  <!-- 外圈六边形装饰 -->
  <polygon points="512,120 850,300 850,724 512,904 174,724 174,300" 
           fill="none" stroke="url(#lineGradient)" stroke-width="8" opacity="0.6"/>
  
  <!-- 内圈六边形 -->
  <polygon points="512,200 780,340 780,684 512,824 244,684 244,340" 
           fill="none" stroke="url(#lineGradient)" stroke-width="6" opacity="0.4"/>
  
  <!-- 神经网络节点和连线 -->
  <g stroke="url(#lineGradient)" stroke-width="3" fill="#00e5ff" opacity="0.8">
    <!-- 中心节点 -->
    <circle cx="512" cy="512" r="30" fill="#00e5ff" filter="url(#glow)"/>
    
    <!-- 周围节点 -->
    <circle cx="512" cy="220" r="18"/>
    <circle cx="720" cy="320" r="18"/>
    <circle cx="720" cy="704" r="18"/>
    <circle cx="512" cy="804" r="18"/>
    <circle cx="304" cy="704" r="18"/>
    <circle cx="304" cy="320" r="18"/>
    
    <!-- 连接线 -->
    <line x1="512" y1="238" x2="512" y2="220" opacity="0.6"/>
    <line x1="702" y1="338" x2="720" y2="320" opacity="0.6"/>
    <line x1="702" y1="686" x2="720" y2="704" opacity="0.6"/>
    <line x1="512" y1="786" x2="512" y2="804" opacity="0.6"/>
    <line x1="322" y1="686" x2="304" y2="704" opacity="0.6"/>
    <line x1="322" y1="338" x2="304" y2="320" opacity="0.6"/>
    
    <!-- 内部连接线 -->
    <line x1="512" y1="482" x2="512" y2="238" opacity="0.4"/>
    <line x1="620" y1="512" x2="702" y2="338" opacity="0.4"/>
    <line x1="620" y1="512" x2="702" y2="686" opacity="0.4"/>
    <line x1="512" y1="542" x2="512" y2="786" opacity="0.4"/>
    <line x1="404" y1="512" x2="322" y2="686" opacity="0.4"/>
    <line x1="404" y1="512" x2="322" y2="338" opacity="0.4"/>
  </g>
  
  <!-- 主文字 -->
  <text x="512" y="540" font-family="Arial, sans-serif" font-size="140" font-weight="bold" 
        fill="white" text-anchor="middle" filter="url(#textGlow)">MJ NEXUS</text>
  
  <!-- 底部装饰线 -->
  <line x1="280" y1="620" x2="744" y2="620" stroke="url(#lineGradient)" stroke-width="4" opacity="0.7"/>
  
  <!-- AI 标签 -->
  <text x="512" y="700" font-family="Arial, sans-serif" font-size="48" font-weight="300" 
        fill="#00e5ff" text-anchor="middle" letter-spacing="20" opacity="0.9">AI ASSISTANT</text>
</svg>