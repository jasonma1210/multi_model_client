name: mj_nexus
description: "MJ Nexus - Multi-Model AI Assistant with local/remote model support, voice dialogue, RAG knowledge base, and memory engine"
publish_to: 'none'

version: 0.43.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (保持 2.x 系列以兼容 drift_dev)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.2.1

  # Network
  dio: ^5.9.2
  connectivity_plus: ^7.1.1

  # Database
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.0

  # UI Components
  cupertino_icons: ^1.0.8

  # Markdown & Code Highlighting (flutter_markdown_plus 替代已停止维护的 flutter_markdown)
  flutter_markdown_plus: ^1.0.3
  highlight: ^0.7.0

  # Utils
  package_info_plus: ^8.0.3
  uuid: ^4.5.1
  intl: ^0.20.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.0
  local_auth: ^3.0.1
  encrypt: ^5.0.3

  # File Operations
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  share_plus: ^10.1.4

  # Networking & Parsing
  url_launcher: ^6.3.1
  html: ^0.15.5

  # FFI
  ffi: ^2.1.0

  # Local LLM Inference (llama.cpp FFI) - 使用 llamadart 替代 llama_cpp_dart
  # v0.6.16+ 支持 GGUF v3 格式、最新 llama.cpp 优化（Metal 加速、Flash Attention、MTP 等）
  llamadart: ^0.6.16

  # Crypto
  crypto: ^3.0.3

  # Background Downloader - 原生后台下载服务，支持断点续传
  # 相比 Dio，App 被划掉后仍能继续下载（使用 Android WorkManager / iOS BackgroundSession）
  background_downloader: ^9.5.4

  # Async utilities
  async: ^2.11.0

  # Text-to-Speech - Sherpa-ONNX (本地离线 TTS，中文优化)
  sherpa_onnx: ^1.12.39

  # Tools & Utilities
  math_expressions: ^3.1.0

  # WebSocket
  web_socket_channel: ^3.0.3

  # HTTP
  http: ^1.2.0

  # Location Services
  geolocator: ^13.0.2
  
  # Chinese Segmentation
  jieba_flutter: ^0.2.0

  # Document parsing
  archive: ^4.0.9

  # Mind map rendering
  flutter_mind_map: ^1.1.2
  
  # PDF rendering (for OCR: render PDF pages to images)
  pdfx: ^2.8.0

  # PDF text extraction (native Dart, supports all platforms)
  syncfusion_flutter_pdf: ^28.2.8
  
  # OCR - textify (纯 Dart 实现，跨平台支持：Android/iOS/Linux/macOS/Windows/Web)
  textify: ^0.5.2
  
  # Audio player with control (play/pause/stop)
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  
  csv: ^8.0.0
  permission_handler: ^12.0.1

  # Audio recording for ASR (hold-to-record)
  record: ^6.2.1
  # Audio recording via miniaudio (macOS compatible, used for voice clone)
  flutter_recorder: ^1.1.5
  
  # System TTS (使用系统内置语音合成)
  flutter_tts: ^4.2.5
  file_selector: ^1.1.0

  # Video/Audio 处理（使用系统原生 API）
  video_compress: ^3.1.3
  
  # OCR - 使用系统原生 API（iOS Vision / Android ML Kit）
  # 模型通过 Google Play Services 按需下载，APK 仅增加几百 KB
  google_mlkit_text_recognition: ^0.14.0
  speech_to_text: ^7.3.0

  # ===== v0.42.0 新增依赖 =====
  # 富文本编辑器（用于系统提示词、项目描述等富文本编辑）
  flutter_quill: ^11.0.0
  # 数据可视化（用于深度研究统计图表）
  syncfusion_flutter_charts: ^28.2.0
  # 任务调度（用于深度研究后台任务）
  cron: ^0.6.1
  # 图表节点展示
  graphview: ^1.2.1
  # Markdown 渲染增强
  markdown: ^7.3.0

  # ===== v0.43.0 新增依赖 =====
  # 图片处理（多模态图片预处理：压缩/格式转换/缩略图）
  image: ^4.3.0
  # Server-Sent Events 客户端（Streamable HTTP Transport / A2A SSE 流）
  # 注：移动端 SSE 流解析直接使用 Dart 标准库 + Dio stream（无需专用包）

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Crash Monitoring - Sentry 崩溃监控（由于网络问题暂时禁用）
  # sentry_flutter: ^8.0.0

  # Lints
  flutter_lints: ^6.0.0

  # Code Generation
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.14
  drift_dev: ^2.28.0

  # Testing
  mocktail: ^1.0.5

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/mj_icon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/mj_icon_1024.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  
  # Assets - 优化：移除大型静态资源，改为按需下载
  assets:
    # App 图标原图（用于 flutter_launcher_icons 生成各尺寸图标）
    - assets/icons/
    
    # OCR tessdata: 65MB → 移除，改用运行时下载
    # 首次使用 OCR 时自动检测并下载
    - assets/ocr/
    # - assets/ocr/tessdata/  # 运行时下载，不打包
    
    # jieba 分词词典: 11MB（保留，因为 jieba_flutter 依赖此路径）
    - assets/jieba/
    
    # 应用图标
    - assets/icons/
    
    # ★★★ 关键修复：添加缺失的资源声明 ★★★
    # 否则 Flutter 框架在 debug 模式下预加载 widget 树时，会因为
    # 找不到资源而触发 SIGSEGV 崩溃（地址 0x12XX000c4，指令 ldur x6, [x24, #0x37]）
    - assets/mj_nexus_logo.png

# ─────────────────────────────────────────────────────────────────────────────
# llamadart Native Assets 配置
#
# 背景：llamadart 默认打包 7 个 CPU 变体 SO（armv8.0 ~ armv9.2），
# 运行时 ggml 自动选最高版本。
# 问题：armv9.2_1 和 armv9.2_2 均含 SME（Scalable Matrix Extension）指令，
#       部分骁龙 Lite 系列固件上报支持 SME，但实际内核未开启（或 Android 16
#       内核对 SME 的支持有 bug），推理时触发 SIGILL（非法指令）闪退。
# 修复：显式排除含 SME 的 armv9.2 变体，只保留稳定的 armv8.x + armv9.0。
#
# 变体特性对照表：
#   android_armv8.0_1  - baseline，全设备兼容
#   android_armv8.2_1  - + DotProd（骁龙 845+）
#   android_armv8.2_2  - + DotProd + FP16
#   android_armv8.6_1  - + DotProd + FP16 + MatMul INT8
#   android_armv9.0_1  - + DotProd + FP16 + MatMul INT8 + SVE2（安全）
#   android_armv9.2_1  - + SVE + SME ← ★ 排除！SME 不稳定
#   android_armv9.2_2  - + SVE + SVE2 + SME ← ★ 排除！SME 不稳定
#
# ⚠️ 修改后必须执行：flutter clean && flutter pub get，否则缓存旧 SO 仍会打包！
# ─────────────────────────────────────────────────────────────────────────────
hooks:
  user_defines:
    llamadart:
      llamadart_native_backends:
        platforms:
          # ★ iOS 配置
          # 启用 Metal 后端：Release 模式下 Metal 正常工作
          # Debug 模式因 Xcode 26.4 LLDB bug 会导致崩溃，Release 模式不受影响
          ios-arm64:
            backends: [cpu, metal]
          # ★ macOS 配置
          # Apple Silicon (M1+) 支持 Metal GPU 加速
          # Intel Mac 仅使用 CPU
          macos-arm64:
            backends: [cpu, metal]
          # ★ Windows 配置
          # 支持 CUDA（NVIDIA GPU）和 Vulkan（AMD/Intel GPU）
          # x86_64 架构
          windows-x86_64:
            backends: [cpu, vulkan]
          # ★ Linux 配置
          # 支持 CUDA 和 Vulkan
          linux-x86_64:
            backends: [cpu, vulkan]
          android-arm64:
            backends: [cpu, vulkan]
            # 只打包不含 SME 的变体，排除 armv9.2_1 和 armv9.2_2
            cpu_variants:
              - android_armv8.0_1
              - android_armv8.2_1
              - android_armv8.2_2
              - android_armv8.6_1
              - android_armv9.0_1
              # android_armv9.2_1 ← 含 SME，排除
              # android_armv9.2_2 ← 含 SME+SVE2，排除（崩溃根因）
